<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CauseTen Music</title>
<style>
    body {
       background: linear-gradient(120deg, #71D0F7 0%, #83C5F4 35%, #B9B9F0 65%, #F7A0CF 100%);
        min-height: 100vh;
        font-family: Arial, sans-serif;
        color: white;
    }
.navbar {
    background-color: rgba(216, 241, 255, 0.65);
    padding: 15px;
    text-align: center;
    border-radius: 10px;
}

.navbar a {
    color: white;
    font-weight: bold;
    text-decoration: none;
    margin: 20px;
    font-size: 18px;
}

.hero {
    text-align: center;
    padding: 100px 20px;
}

.hero h1 {
    font-size: 60px;
    margin-bottom: 20px;
    text-shadow: 2px 2px 8px #8B78C9;
}

.hero p {
    font-size: 20px;
    line-height: 1.8;
}

.band-logo {
    width: 220px;
    border-radius: 20px;
    margin-bottom: 20px;
}

.music-intro {
    text-align: center;
    padding: 90px 20px 50px;
}

.music-intro h1 {
    font-size: 60px;
    letter-spacing: 5px;
    margin-bottom: 25px;
}

.music-intro p {
    font-size: 19px;
    line-height: 1.8;
}

.music-content {
    max-width: 650px;
    margin: 20px auto;
    padding: 35px;
    text-align: center;
    border: 2px solid white;
    border-radius: 20px;
    background-color: rgba(255, 255, 255, 0.12);
}

.music-content h2 {
    font-size: 28px;
    letter-spacing: 3px;
}

.music-content p {
    font-size: 18px;
    line-height: 1.8;
}

.douyin-button {
    display: inline-block;
    background: linear-gradient(120deg, #F7A0CF, #B9B9F0);
    color: white;
    padding: 14px 30px;
    margin: 20px;
    border-radius: 30px;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
    transition: 0.3s;
}

.douyin-button:hover {
    background: #83C5F4;
    transform: scale(1.05);
}
</style>

</head>

<body>

<div class="navbar">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>

    <h1>OUR SOUND.</h1>
    <p>Our journey is just getting started.</p>
    <p>Follow CauseTen for live performances and updates.</p>
</div>

<div class="music-content">
    <h2>WATCH US PLAY</h2>
    <p>Check out our performances on Douyin!</p>

   target="_blank"
